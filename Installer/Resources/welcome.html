<html><meta charset="utf-8"><body style="font-family:-apple-system;font-size:14px;line-height:1.6"><h1>安装 Codex Quota</h1><p>在 Mac 菜单栏查看 Codex 剩余额度。</p><ul><li>圆环与横条两种样式，自动记住选择</li><li>悬停查看重置时间，点击查看额度详情</li><li>每分钟自动刷新，仅运行一个实例</li></ul><p>此安装包适用于 Apple Silicon Mac，要求 macOS 14 或更高版本。</p><p>点击“继续”开始安装。</p></body></html>
